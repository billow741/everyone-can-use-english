version: '3.8'

services:
  enjoy-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: sunnybridge-enjoy-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-deepseek-chat}
    env_file:
      - ../server/.env
